name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project files
        run: |
          mkdir -p "."
          cat > "settings.gradle" <<'ENDOFFILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "QuoteCalculator"
          include ':app'
          ENDOFFILE
          mkdir -p "."
          cat > "build.gradle" <<'ENDOFFILE'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          ENDOFFILE
          mkdir -p "."
          cat > "gradle.properties" <<'ENDOFFILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          ENDOFFILE
          mkdir -p "app"
          cat > "app/build.gradle" <<'ENDOFFILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.quote.calculator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.quote.calculator"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          ENDOFFILE
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ENDOFFILE
          mkdir -p "app/src/main/res/values"
          cat > "app/src/main/res/values/strings.xml" <<'ENDOFFILE'
          <resources>
              <string name="app_name">מחשבון הצעת מחיר</string>
          </resources>
          ENDOFFILE
          mkdir -p "app/src/main/res/values"
          cat > "app/src/main/res/values/styles.xml" <<'ENDOFFILE'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#1E3A8A</item>
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
          </resources>
          ENDOFFILE
          mkdir -p "app/src/main/res/drawable"
          cat > "app/src/main/res/drawable/ic_bg.xml" <<'ENDOFFILE'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#1E3A8A"/></shape>
          ENDOFFILE
          mkdir -p "app/src/main/res/drawable"
          cat > "app/src/main/res/drawable/ic_fg.xml" <<'ENDOFFILE'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M38,30h32a4,4 0,0 1,4 4v40a4,4 0,0 1,-4 4h-32a4,4 0,0 1,-4 -4v-40a4,4 0,0 1,4 -4z"/>
              <path android:fillColor="#1E3A8A" android:pathData="M40,36h28v10h-28z"/>
              <path android:fillColor="#1E3A8A" android:pathData="M40,51h7v6h-7zM50.5,51h7v6h-7zM61,51h7v6h-7zM40,61h7v6h-7zM50.5,61h7v6h-7zM61,61h7v12h-7zM40,70h17.5v3h-17.5z"/>
          </vector>
          ENDOFFILE
          mkdir -p "app/src/main/res/mipmap-anydpi-v26"
          cat > "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          ENDOFFILE
          mkdir -p "app/src/main/res/mipmap-anydpi"
          cat > "app/src/main/res/mipmap-anydpi/ic_launcher.xml" <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@drawable/ic_bg"/>
              <item android:drawable="@drawable/ic_fg"/>
          </layer-list>
          ENDOFFILE
          mkdir -p "app/src/main/java/com/quote/calculator"
          cat > "app/src/main/java/com/quote/calculator/MainActivity.java" <<'ENDOFFILE'
          package com.quote.calculator;
          
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          
          public class MainActivity extends Activity {
          
              private static final String START_URL = "https://ruddy-print-job-go.base44.app/QuoteCalculator";
              private static final String HOST = "ruddy-print-job-go.base44.app";
              private static final int FILE_REQUEST = 1001;
          
              private WebView webView;
              private ProgressBar progress;
              private LinearLayout offlineView;
              private ValueCallback<Uri[]> fileCallback;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
          
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.WHITE);
          
                  webView = new WebView(this);
                  root.addView(webView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
          
                  progress = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progress.setMax(100);
                  FrameLayout.LayoutParams pp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(4));
                  pp.gravity = Gravity.TOP;
                  root.addView(progress, pp);
          
                  offlineView = buildOfflineView();
                  offlineView.setVisibility(View.GONE);
                  root.addView(offlineView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
          
                  setContentView(root);
          
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
          
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
          
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleUrl(request.getUrl());
                      }
          
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          progress.setVisibility(View.VISIBLE);
                      }
          
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progress.setVisibility(View.GONE);
                          CookieManager.getInstance().flush();
                      }
          
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              offlineView.setVisibility(View.VISIBLE);
                          }
                      }
                  });
          
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          progress.setProgress(newProgress);
                      }
          
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                                                       FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), FILE_REQUEST);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });
          
                  webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, length) -> {
                      if (url.startsWith("blob:") || url.startsWith("data:")) {
                          Toast.makeText(this, "לא ניתן להוריד את הקובץ הזה מתוך האפליקציה", Toast.LENGTH_LONG).show();
                          return;
                      }
                      try {
                          DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                          String name = URLUtil.guessFileName(url, contentDisposition, mimeType);
                          r.setMimeType(mimeType);
                          r.addRequestHeader("cookie", CookieManager.getInstance().getCookie(url));
                          r.addRequestHeader("User-Agent", userAgent);
                          r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                          ((DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE)).enqueue(r);
                          Toast.makeText(this, "מוריד: " + name, Toast.LENGTH_SHORT).show();
                      } catch (Exception e) {
                          openExternal(Uri.parse(url));
                      }
                  });
          
                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      loadStart();
                  }
              }
          
              private boolean handleUrl(Uri uri) {
                  String scheme = uri.getScheme() == null ? "" : uri.getScheme();
                  String host = uri.getHost() == null ? "" : uri.getHost();
                  if ((scheme.equals("http") || scheme.equals("https"))
                          && (host.equals(HOST) || host.endsWith("base44.app") || host.endsWith("base44.com"))) {
                      return false; // stay inside the app
                  }
                  openExternal(uri); // WhatsApp, phone, email, other sites
                  return true;
              }
          
              private void openExternal(Uri uri) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (Exception e) {
                      Toast.makeText(this, "אין אפליקציה שיכולה לפתוח את הקישור", Toast.LENGTH_SHORT).show();
                  }
              }
          
              private void loadStart() {
                  if (isOnline()) {
                      offlineView.setVisibility(View.GONE);
                      webView.loadUrl(START_URL);
                  } else {
                      offlineView.setVisibility(View.VISIBLE);
                  }
              }
          
              private boolean isOnline() {
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (cm == null) return true;
                  NetworkInfo ni = cm.getActiveNetworkInfo();
                  return ni != null && ni.isConnected();
              }
          
              private LinearLayout buildOfflineView() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER);
                  box.setBackgroundColor(Color.WHITE);
                  box.setPadding(dp(32), dp(32), dp(32), dp(32));
          
                  TextView t = new TextView(this);
                  t.setText("אין חיבור לאינטרנט");
                  t.setTextSize(22);
                  t.setTextColor(Color.parseColor("#1E3A8A"));
                  t.setGravity(Gravity.CENTER);
                  box.addView(t);
          
                  TextView sub = new TextView(this);
                  sub.setText("בדוק את החיבור ונסה שוב");
                  sub.setTextSize(16);
                  sub.setTextColor(Color.DKGRAY);
                  sub.setGravity(Gravity.CENTER);
                  sub.setPadding(0, dp(8), 0, dp(24));
                  box.addView(sub);
          
                  Button retry = new Button(this);
                  retry.setText("נסה שוב");
                  retry.setOnClickListener(v -> {
                      if (webView.getUrl() == null) loadStart();
                      else if (isOnline()) { offlineView.setVisibility(View.GONE); webView.reload(); }
                  });
                  box.addView(retry);
                  return box;
              }
          
              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }
          
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_REQUEST && fileCallback != null) {
                      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      fileCallback = null;
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }
          
              @Override
              public void onBackPressed() {
                  if (offlineView.getVisibility() == View.VISIBLE) {
                      super.onBackPressed();
                  } else if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          
              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }
          
              @Override
              protected void onPause() {
                  super.onPause();
                  CookieManager.getInstance().flush();
              }
          }
          ENDOFFILE

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk QuoteCalculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QuoteCalculator-APK
          path: QuoteCalculator.apk
